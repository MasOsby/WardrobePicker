<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wardrobe Picker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 40px;
        }
        h1 { color: #333; }
        .images {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .images img {
            width: 200px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .description {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
        }
        .modal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        z-index: 100;
        }
    </style>
</head>
<body>
    <h1>Today's Outfit 👕</h1>
    <button onclick="showModal()">Get New Outfit</button>
    <div class="modal" id="outfit-modal">
        <div class="images" id="outfit-images"></div>
        <button onclick="closeModal()">X</button>
        <div class="description" id="outfit-description"></div>
    </div>

    <script>

        function showModal() {
            document.getElementById("outfit-modal").style.display = "block";

                fetch("/generate")
            .then(res => res.json())
            .then(data => {
                // Display images
                data.images.forEach(filename => {
                    const img = document.createElement("img");
                    img.src = "Clothing/" + filename;
                    document.getElementById("outfit-images").appendChild(img);
                });

                // Display description
                document.getElementById("outfit-description").innerText = data.outfit_description;
            });
        }
        function closeModal() {
            document.getElementById("outfit-modal").style.display = "none";
        }
    </script>
</body>
</html>
